# ---------------------------------------------------------------------------
# 站点地址：部署为 https://mr-xiaoliang.github.io/WorldWiki/ 子路径。
# 仓库更名后需同步修改 site_url 与 repo_url，否则搜索索引与站点地图中的链接会指向错误位置。
# ---------------------------------------------------------------------------

site_name: 另一个代码构成的世界
site_description: 时间、星际、种族与器物的一份设定集合。
site_url: https://mr-xiaoliang.github.io/WorldWiki/
repo_url: https://github.com/Mr-XiaoLiang/WorldWiki
repo_name: Mr-XiaoLiang/WorldWiki

docs_dir: docs
site_dir: site

# 不声明 nav：导航与分区索引由 docs/ 目录树自动生成。
# 新增 Markdown 文件只需放入对应文件夹，无需修改本文件。

theme:
  name: material
  language: zh
  # 关闭 Google Fonts 外链，改用系统字体栈，避免境外网络阻塞首屏。
  font: false
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
  # 深色置于首位，保证默认进入深色终端模式；右侧为切换后的模式。
  palette:
    - scheme: slate
      primary: black
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: 切换至浅色模式
    - scheme: default
      primary: black
      accent: teal
      toggle:
        icon: material/weather-night
        name: 切换至深色模式

plugins:
  # 构建期自动生成搜索索引，覆盖页面标题、各级小标题与正文。
  # lang 指定中文分词，需在 requirements.txt 中提供 jieba。
  - search:
      lang:
        - zh

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      title: 本页目录
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde

extra_css:
  - stylesheets/extra.css
extra_javascript:
  - javascripts/lightbox.js

extra:
  generator: false
